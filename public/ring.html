  <p class="kicker">Project · Full-stack</p><h2 id="d-title">Gamify.Life</h2>
  <p>A full-stack app that turns real-life hobbies into an RPG: 121 skills across 10 hobbies as prerequisite graphs, an XP ledger, quests and achievements, inside a retro desktop-OS interface. Server-authoritative progression validated with Zod and committed with Postgres advisory locks, row-level security, and 125+ Vitest/Playwright tests with axe accessibility checks.</p>
  <ul class="chips"><li>Next.js</li><li>TypeScript</li><li>Supabase</li><li>PostgreSQL</li><li>Pixi.js</li></ul>
  <p class="links"><a href="https://gamify-life-amber.vercel.app" target="_blank" rel="noopener">Live ↗</a><a href="https://github.com/Neo-Land/Gamify-Life" target="_blank" rel="noopener">Code ↗</a></p>
